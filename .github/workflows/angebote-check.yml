name: Angebotsportal - Unterlagen pruefen
on:
  push:
    paths: ['angebote/**', 'angebote-tests/**', '.github/workflows/angebote-check.yml']
  pull_request:
    paths: ['angebote/**', 'angebote-tests/**', '.github/workflows/angebote-check.yml']
permissions:
  contents: read
jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vertragsunterlagen und Download-Verweise pruefen
        run: node angebote-tests/check-legal.mjs
      - name: Kundenoberflaeche syntaktisch pruefen
        run: node --check angebote/app.mjs
      - name: Ersteinrichtung syntaktisch pruefen
        run: node --check angebote/setup.mjs
      - name: PDF-Verarbeitung syntaktisch pruefen
        run: node --check angebote/core.mjs
      - name: Abschlussuebersicht syntaktisch pruefen
        run: node --check angebote/checkout.mjs
      - name: Anlagenauswahl und Paketgrenzen pruefen
        run: node angebote-tests/attachments.mjs
      - name: PDF-Ruecksendung und E-Mail-Ersatzweg pruefen
        run: node angebote-tests/return.mjs
      - name: Smartphone-Unterschrift und Scrollfreigabe pruefen
        run: node angebote-tests/signature-touch.mjs
      - name: PHP-Syntax pruefen
        run: for file in angebote/server/*.php angebote/widerruf.php; do php -l "$file" || exit 1; done
      - name: Isolierte PHP-Testlaufzeit installieren
        run: npm install --prefix "$RUNNER_TEMP/portal-tests" --ignore-scripts --no-audit --no-fund @php-wasm/node@3.1.61 @php-wasm/universal@3.1.61 pdf-lib@1.17.1
      - name: PDF-Signatur und Seitenformate pruefen
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: ${{ runner.temp }}/portal-tests/node_modules
        run: node angebote-tests/stamp.mjs
      - name: Persoenliche Links, Altzugaenge und Abschluss-Sperren pruefen
        env:
          PHP_WASM_MODULE_ROOT: ${{ runner.temp }}/portal-tests/node_modules
        run: node angebote-tests/backend.mjs
      - name: Geschuetzte Ersteinrichtung und Freigabesperre pruefen
        env:
          PHP_WASM_MODULE_ROOT: ${{ runner.temp }}/portal-tests/node_modules
        run: node angebote-tests/setup.mjs
      - name: Private Google-Verbindung und Rueckleitung pruefen
        env:
          PHP_WASM_MODULE_ROOT: ${{ runner.temp }}/portal-tests/node_modules
        run: node angebote-tests/drive-connect.mjs
      - name: Passwortwechsel und bestehende Archivdaten pruefen
        env:
          PHP_WASM_MODULE_ROOT: ${{ runner.temp }}/portal-tests/node_modules
        run: node angebote-tests/password.mjs
      - name: Gesperrten Kundenbetrieb und festen Archivtest pruefen
        env:
          PHP_WASM_MODULE_ROOT: ${{ runner.temp }}/portal-tests/node_modules
        run: node angebote-tests/archive-test.mjs

      - name: Abschlussbenachrichtigung nach gepruefter Ablage pruefen
        env:
          PHP_WASM_MODULE_ROOT: ${{ runner.temp }}/portal-tests/node_modules
        run: node angebote-tests/notification.mjs

      - name: Einzelne Drive-PDF und anschliessende Zwischenablagebereinigung pruefen
        env:
          PHP_WASM_MODULE_ROOT: ${{ runner.temp }}/portal-tests/node_modules
        run: node angebote-tests/drive-pdf-only.mjs
      - name: Verbindlichen Abschluss, Vertragskopie und unabhaengigen Widerruf pruefen
        env:
          PHP_WASM_MODULE_ROOT: ${{ runner.temp }}/portal-tests/node_modules
        run: node angebote-tests/checkout.mjs
