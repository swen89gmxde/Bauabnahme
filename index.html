<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bauabnahmeprotokoll</title>

<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Segoe UI,Arial;background:#f3f4f6;margin:0}
.container{max-width:800px;margin:20px auto;background:#fff;padding:26px;border-radius:14px}
h2{margin-top:0}

fieldset{border:none;padding:16px 0 22px;margin-bottom:18px;border-bottom:1px solid #ddd}
legend{font-weight:600;color:#0a3d62}

input,select,textarea{
  width:100%;
  padding:6px;
  border-radius:6px;
  border:1px solid #ccc;
}

textarea{min-height:70px}
.row{display:flex;gap:10px}
.row div{flex:1}

canvas{width:100%;height:140px;border:2px dashed #0a3d62;border-radius:8px}

button{margin-top:10px;padding:12px;border:none;border-radius:10px;cursor:pointer}
.main{background:#0a3d62;color:#fff;width:100%}
.share{background:#28a745;color:#fff;width:100%}

#printMaengel{white-space:pre-wrap;border:1px solid #ccc;padding:8px;border-radius:6px;display:none}

/* Bilder */
#preview img{
  width:100%;
  max-height:150px;
  object-fit:cover;
  border-radius:8px;
  margin-top:6px;
}
</style>
</head>

<body>
<div class="container">

<h2>🔧 Bauabnahmeprotokoll</h2>

<div id="page1">
<fieldset>
<legend>Kunde</legend>
<input id="kundeInput">
</fieldset>
</div>

<div id="page2">
<fieldset>
<legend>⚠️ Mängel</legend>

<textarea id="maengelInput"></textarea>
<div id="printMaengel"></div>

<!-- 📸 FOTO -->
<label>📸 Fotos aufnehmen</label>
<input type="file" accept="image/*" capture="environment" multiple onchange="handleImages(event)">
<div id="preview"></div>

</fieldset>
</div>

<div id="signSection">
<fieldset>
<legend>Unterschrift</legend>

<canvas id="sig"></canvas>
<button onclick="signaturePad.clear()">Löschen</button>

</fieldset>
</div>

<button class="main" onclick="generatePDF()">📄 PDF erstellen</button>
<button class="share" onclick="sharePDF()">📤 Teilen</button>

</div>

<script>
let imageDataList = [];

function handleImages(event){
  const files = event.target.files;
  const preview = document.getElementById("preview");

  for(let file of files){
    const reader = new FileReader();
    reader.onload = function(e){
      imageDataList.push(e.target.result);

      const img = document.createElement("img");
      img.src = e.target.result;
      preview.appendChild(img);
    }
    reader.readAsDataURL(file);
  }
}

// SIGNATUR
const sigCanvas = document.getElementById("sig");
const signaturePad = new SignaturePad(sigCanvas,{backgroundColor:"white"});

function resizeCanvas(){
  const ratio = Math.max(window.devicePixelRatio||1,1);
  sigCanvas.width = sigCanvas.offsetWidth*ratio;
  sigCanvas.height = sigCanvas.offsetHeight*ratio;
  sigCanvas.getContext("2d").setTransform(ratio,0,0,ratio,0,0);
}
resizeCanvas();

// PDF ERSTELLEN
async function buildPDF(){

  const input = document.getElementById("maengelInput");
  const print = document.getElementById("printMaengel");

  print.innerText = input.value;
  print.style.display = "block";
  input.style.display = "none";

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p","mm","a4");

  const p1=document.getElementById("page1");
  const p2=document.getElementById("page2");
  const p3=document.getElementById("signSection");

  const c1 = await html2canvas(p1,{scale:2});
  pdf.addImage(c1.toDataURL(),"JPEG",10,10,190,c1.height*190/c1.width);

  pdf.addPage();
  const c2 = await html2canvas(p2,{scale:2});
  pdf.addImage(c2.toDataURL(),"JPEG",10,10,190,c2.height*190/c2.width);

  // 📸 Bilder extra Seiten
  for(let img of imageDataList){
    pdf.addPage();
    pdf.addImage(img,"JPEG",10,10,190,120);
  }

  pdf.addPage();
  const c3 = await html2canvas(p3,{scale:2});
  pdf.addImage(c3.toDataURL(),"JPEG",10,10,190,c3.height*190/c3.width);

  input.style.display = "block";
  print.style.display = "none";

  return pdf;
}

// PDF speichern Button
async function generatePDF(){
  const pdf = await buildPDF();
  pdf.save("Bauabnahmeprotokoll.pdf");
}

// 📤 TEILEN (WhatsApp etc.)
async function sharePDF(){
  const pdf = await buildPDF();

  const blob = pdf.output("blob");
  const file = new File([blob], "Bauabnahme.pdf", { type: "application/pdf" });

  if(navigator.share){
    navigator.share({
      title: "Bauabnahmeprotokoll",
      files: [file]
    });
  } else {
    alert("Teilen wird auf diesem Gerät nicht unterstützt");
  }
}
</script>

</body>
</html>
