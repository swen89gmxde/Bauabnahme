<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bauabnahmeprotokoll</title>

<!-- ✅ Scripte korrekt -->
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Segoe UI,Roboto,Arial,sans-serif;background:#f3f4f6;margin:0}
.container{max-width:800px;margin:20px auto;background:#fff;padding:26px;border-radius:14px}
h2{margin-top:0}

fieldset{border:none;padding:16px 0 22px;margin-bottom:18px;border-bottom:1px solid #e3e3e3}
legend{font-weight:600;color:#0a3d62}

label{display:block;margin-top:8px}

input,select,textarea{
  width:100%;
  padding:6px 8px;
  border-radius:6px;
  border:1px solid #ccc;
  font-size:14px;
}

textarea{min-height:70px}

/* ✅ Abstand verbessert */
.row{
  display:flex;
  gap:15px;
}
.row div{flex:1}

canvas{
  width:100%;
  height:140px;
  border:2px dashed #0a3d62;
  border-radius:8px;
}

button.main{
  background:#0a3d62;
  color:#fff;
  padding:14px;
  border:none;
  border-radius:10px;
  width:100%;
  cursor:pointer;
}
button.share{
  background:#28a745;
  color:#fff;
  padding:14px;
  border:none;
  border-radius:10px;
  width:100%;
  margin-top:10px;
  cursor:pointer;
}

/* ✅ Mehrzeilig-Fix */
#printMaengel{
  white-space: pre-wrap;
  border:1px solid #ccc;
  padding:8px;
  border-radius:6px;
  display:none;
}

/* ✅ Bilder */
#preview img{
  width:100%;
  max-height:140px;
  object-fit:cover;
  border-radius:8px;
  margin-top:6px;
}
</style>
</head>

<body>
<div class="container">
<h2>🔧 Bauabnahmeprotokoll Sichtwerk</h2>

<!-- Seite 1 -->
<div id="page1">
<fieldset>
<legend>👤 1. Projekt- und Kundendaten</legend>

<label>Kunde</label>
<input id="kundeInput">

<label>Adresse</label>
<input>

<label>Telefon / E-Mail</label>
<input>

<div class="row">
  <div>
    <label>Auftragsnr.</label>
    <input>
  </div>
  <div>
    <label>Montagedatum</label>
    <input type="date">
  </div>
</div>

<label>Objektadresse</label>
<input>

</fieldset>
</div>

<!-- Seite 2 -->
<div id="page2">
<fieldset>
<legend>⚠️ 4. Dokumentierte Mängel</legend>

<textarea id="maengelInput"></textarea>
<div id="printMaengel"></div>

<label>📸 Fotos</label>
<input type="file" accept="image/*" capture="environment" multiple onchange="handleImages(event)">
<div id="preview"></div>

</fieldset>
</div>

<!-- Seite 3 -->
<div id="signSection">
<fieldset>
<legend>✍️ 6. Unterschriften</legend>

<label>Unterschrift Auftraggeber</label>
<canvas id="sig"></canvas>

<label>Unterschrift Auftragnehmer</label>
<img src="images/unterschrift_auftragnehmer.jpg"
     style="width:100%;max-height:140px;object-fit:contain;border:2px dashed #0a3d62;border-radius:8px">

</fieldset>
</div>

<button class="main" onclick="generatePDF()">📄 PDF erstellen</button>
<button class="share" onclick="sharePDF()">📤 Teilen</button>

</div>

<script>
let imageDataList = [];

// 📸 Bilder sauber laden (kein doppelt!)
function handleImages(event){
  imageDataList = []; // ✅ reset verhindert doppelte

  const preview = document.getElementById("preview");
  preview.innerHTML = ""; // ✅ reset

  const files = event.target.files;

  for(let file of files){
    const reader = new FileReader();
    reader.onload = function(e){
      imageDataList.push(e.target.result);

      const img = document.createElement("img");
      img.src = e.target.result;
      preview.appendChild(img);
    }
    reader.readAsDataURL(file);
  }
}

// SIGNATUR
const sigCanvas=document.getElementById("sig");
const signaturePad=new SignaturePad(sigCanvas,{backgroundColor:"white"});

function resizeCanvas(){
  const r=Math.max(window.devicePixelRatio||1,1);
  sigCanvas.width=sigCanvas.offsetWidth*r;
  sigCanvas.height=sigCanvas.offsetHeight*r;
  sigCanvas.getContext("2d").setTransform(r,0,0,r,0,0);
}
resizeCanvas();

// PDF BUILD
async function buildPDF(){

  const input=document.getElementById("maengelInput");
  const print=document.getElementById("printMaengel");

  print.innerText=input.value;
  print.style.display="block";
  input.style.display="none";

  const { jsPDF } = window.jspdf;
  const pdf=new jsPDF("p","mm","a4");

  const p1=document.getElementById("page1");
  const p2=document.getElementById("page2");
  const p3=document.getElementById("signSection");

  const c1=await html2canvas(p1,{scale:2});
  pdf.addImage(c1.toDataURL(),"JPEG",10,10,190,c1.height*190/c1.width);

  pdf.addPage();
  const c2=await html2canvas(p2,{scale:2});
  pdf.addImage(c2.toDataURL(),"JPEG",10,10,190,c2.height*190/c2.width);

  // 📸 Bilder einfügen
  imageDataList.forEach(img=>{
    pdf.addPage();
    pdf.addImage(img,"JPEG",10,10,190,120);
  });

  pdf.addPage();
  const c3=await html2canvas(p3,{scale:2});
  pdf.addImage(c3.toDataURL(),"JPEG",10,10,190,c3.height*190/c3.width);

  input.style.display="block";
  print.style.display="none";

  return pdf;
}

// Speichern
async function generatePDF(){
  const pdf = await buildPDF();
  pdf.save("Bauabnahmeprotokoll.pdf");
}

// Teilen
async function sharePDF(){
  const pdf = await buildPDF();

  const blob = pdf.output("blob");
  const file = new File([blob], "Bauabnahmeprotokoll.pdf", { type: "application/pdf" });

  if(navigator.share){
    await navigator.share({
      files: [file]
    });
  } else {
    alert("Teilen nicht unterstützt");
  }
}
</script>

</body>
</html>
