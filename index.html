<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bauabnahmeprotokoll</title>

<!-- ✅ WICHTIG: KORREKTE SCRIPT TAGS -->
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Segoe UI,Roboto,Arial,sans-serif;background:#f3f4f6;margin:0}
.container{max-width:800px;margin:20px auto;background:#fff;padding:26px;border-radius:14px}
h2{margin-top:0}

fieldset{border:none;padding:16px 0 22px;margin-bottom:18px;border-bottom:1px solid #e3e3e3}
legend{font-weight:600;color:#0a3d62;font-size:16px}
label{display:block;margin-top:8px;font-size:14px}

input,select,textarea{
  width:100%;
  padding:5px 8px;
  height:30px;
  line-height:18px;
  box-sizing:border-box;
  border-radius:6px;
  border:1px solid #cfcfcf;
  font-size:14px;
}
input[type="date"]{height:28px}
textarea{min-height:70px;height:auto}

.row{display:flex;gap:12px}
.row div{flex:1}

canvas{
  width:100%;
  height:140px;
  border:2px dashed #0a3d62;
  border-radius:8px;
}

button.main{
  background:#0a3d62;
  color:#fff;
  padding:14px;
  border:none;
  border-radius:10px;
  width:100%;
  cursor:pointer;
}
button.share{
  background:#28a745;
  color:#fff;
  padding:14px;
  border:none;
  border-radius:10px;
  width:100%;
  margin-top:10px;
  cursor:pointer;
}

.smallbtn{
  background:#999;
  color:#fff;
  border:none;
  padding:6px 14px;
  border-radius:6px;
  margin-top:8px;
  cursor:pointer;
}

/* FIX mehrzeilig */
#printMaengel{
  white-space: pre-wrap;
  display:none;
  border:1px solid #ccc;
  padding:8px;
  border-radius:6px;
}

/* Bilder */
#preview img{
  width:100%;
  max-height:140px;
  object-fit:cover;
  margin-top:6px;
  border-radius:8px;
}
</style>
</head>

<body>
<div class="container">
<h2>🔧 Bauabnahmeprotokoll Sichtwerk</h2>

<!-- SEITE 1 -->
<div id="page1">
<fieldset>
<legend>👤 1. Projekt- und Kundendaten</legend>

<label>Kunde</label>
<input id="kundeInput">

<label>Adresse</label>
<input>

<label>Telefon / E-Mail</label>
<input>

<div class="row">
  <div><label>Auftragsnr.</label><input></div>
  <div><label>Montagedatum</label><input type="date"></div>
</div>

<label>Objektadresse</label>
<input>
</fieldset>

<fieldset>
<legend>🛠️ 2. Leistungsbeschreibung</legend>
<select>
  <option>Fenster</option>
  <option>Türen</option>
  <option>Fenster & Türen</option>
  <option>Fenster & Rollos</option>
  <option>Rollos</option>
  <option>Nachjustierung</option>
</select>
</fieldset>
</div>

<!-- SEITE 2 -->
<div id="page2">
<fieldset>
<legend>✅ 3. Prüfung</legend>
<select>
  <option>Ja</option>
  <option>Nein</option>
  <option>Teilweise</option>
</select>
</fieldset>

<fieldset>
<legend>⚠️ 4. Dokumentierte Mängel</legend>

<textarea id="maengelInput"></textarea>
<div id="printMaengel"></div>

<label>📸 Fotos</label>
<input type="file" accept="image/*" capture="environment" multiple onchange="handleImages(event)">
<div id="preview"></div>

</fieldset>

<fieldset>
<legend>📄 5. Abnahme</legend>
<select>
  <option>Ohne Vorbehalt</option>
  <option>Unter Vorbehalt</option>
  <option>Abnahme verweigert</option>
</select>
</fieldset>
</div>

<!-- SEITE 3 -->
<div id="signSection" style="padding-bottom:30mm">
<fieldset>
<legend>✍️ 6. Unterschriften</legend>

<div class="row">
  <div><label>Ort</label><input></div>
  <div><label>Datum</label><input type="date"></div>
</div>

<label>Unterschrift Auftraggeber</label>
<canvas id="sig"></canvas>
<button type="button" class="smallbtn" onclick="signaturePad.clear()">Löschen</button>

<label>Unterschrift Auftragnehmer</label>
<img src="images/unterschrift_auftragnehmer.jpg.jpg" style="width:100%;max-height:140px;object-fit:contain;border:2px dashed #0a3d62;border-radius:8px">

</fieldset>
</div>

<button class="main" onclick="generatePDF()">📄 PDF erstellen</button>
<button class="share" onclick="sharePDF()">📤 Teilen</button>

</div>

<script>
let imageDataList=[];

// Bilder laden (ohne doppelte)
function handleImages(event){
  imageDataList=[];
  const preview=document.getElementById("preview");
  preview.innerHTML="";

  for(let file of event.target.files){
    const reader=new FileReader();
    reader.onload=function(e){
      imageDataList.push(e.target.result);

      const img=document.createElement("img");
      img.src=e.target.result;
      preview.appendChild(img);
    }
    reader.readAsDataURL(file);
  }
}

// SIGNATUR
const sigCanvas=document.getElementById("sig");
const signaturePad=new SignaturePad(sigCanvas,{backgroundColor:"white"});

function resizeCanvas(){
  const r=Math.max(window.devicePixelRatio||1,1);
  sigCanvas.width=sigCanvas.offsetWidth*r;
  sigCanvas.height=sigCanvas.offsetHeight*r;
  sigCanvas.getContext("2d").setTransform(r,0,0,r,0,0);
}
resizeCanvas();

// PDF erstellen
async function buildPDF(){

  const preview = document.getElementById("preview");
  preview.style.display = "none"; // ✅ verhindert doppelte Bilder

  const input=document.getElementById("maengelInput");
  const print=document.getElementById("printMaengel");
  print.innerText=input.value;
  print.style.display="block";
  input.style.display="none";

  const { jsPDF }=window.jspdf;
  const pdf=new jsPDF("p","mm","a4");

  const c1=await html2canvas(page1,{scale:2});
  pdf.addImage(c1.toDataURL(),"JPEG",10,10,190,c1.height*190/c1.width);

  pdf.addPage();
  const c2=await html2canvas(page2,{scale:2});
  pdf.addImage(c2.toDataURL(),"JPEG",10,10,190,c2.height*190/c2.width);

  // ✅ Bilder extra Seiten
  imageDataList.forEach(img=>{
    pdf.addPage();
    pdf.addImage(img,"JPEG",10,10,190,120);
  });

  pdf.addPage();
  const c3=await html2canvas(signSection,{scale:2});
  pdf.addImage(c3.toDataURL(),"JPEG",10,10,190,c3.height*190/c3.width);

  // zurücksetzen
  preview.style.display = "block";
  input.style.display="block";
  print.style.display="none";

  return pdf;
}

// speichern
async function generatePDF(){
  const pdf=await buildPDF();
  const name = document.getElementById("kundeInput").value.trim();
const safe = name ? name.replace(/[^a-z0-9]/gi, "_") : "Unbekannt";

pdf.save(`Bauabnahmeprotokoll_${safe}.pdf`);
``
}

// teilen
async function sharePDF(){
  const pdf=await buildPDF();
  const blob=pdf.output("blob");
  const file=new File([blob],"Bauabnahmeprotokoll.pdf",{type:"application/pdf"});

  if(navigator.share){
    await navigator.share({files:[file]});
  } else {
    alert("Teilen nicht unterstützt");
  }
}
</script>

</body>
</html>
